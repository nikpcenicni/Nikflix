apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dev-cluster-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.10.240-192.168.10.245
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: dev-cluster-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - dev-cluster-pool
