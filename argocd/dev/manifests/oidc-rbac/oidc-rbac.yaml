# RBAC for the cluster-wide OIDC identity space defined by the
# AuthenticationConfiguration in development/talos/patches/cp-*.yaml (live
# on the cluster - confirmed directly via `talosctl read
# /var/lib/kube-apiserver/authentication-config.yaml` on a control-plane
# node; the "not yet applied" note that used to be here was stale). A valid
# JWT from authentik authenticates successfully today but grants zero
# permissions until a binding like this exists - see
# argocd/dev/values/authentik-values.yaml's "Kubernetes human access"
# blueprint entry for the authentik-side group/provider definition this
# binding references by name.
#
# There used to be a second identity space here, "che" (Eclipse Che
# dashboard OIDC login), with its own che-devworkspace-user ClusterRole/
# ClusterRoleBinding. Removed: che-operator v2 on plain (non-OpenShift)
# Kubernetes does not forward a logged-in user's own OIDC token to the
# Kubernetes API server (confirmed from che-operator's own source,
# pkg/deploy/gateway/gateway.go), so that jwt[] entry and this RBAC had no
# functional consumer - see development/talos/patches/cp-*.yaml's updated
# comment and argocd/README.md's "Eclipse Che" section for the corrected
# model (Che's own devEnvironments.user.clusterRoles, in
# dev/manifests/che-cluster/checluster.yaml, now does this instead).

# --- k8s-human-access: direct human/CLI access -----------------------------
# claimMappings for this issuer apply an EMPTY prefix to both username (sub)
# and groups, so the raw authentik group name below is what Kubernetes sees
# on the token, unmodified. "Kubernetes Admins" is the authentik group
# created in dev/values/authentik-values.yaml (id: group-kubernetes-admins) -
# akadmin is its only member today, in this single-admin homelab.
#
# Bound to cluster-admin rather than a narrower role: this identity
# represents the repo owner's own direct CLI access, already equivalent to
# cluster-admin today via the X.509 admin kubeconfig
# (development/talos/kubeconfig). This binding is a second, more convenient
# (browser/PKCE) front door onto the SAME access level for the SAME person,
# not an expansion of the trust boundary - so cluster-admin matches, rather
# than exceeds, today's existing exposure. Revisit this if "Kubernetes
# Admins" ever gains a member who isn't the repo owner - cluster-admin would
# then need to be reconsidered per-member rather than assumed safe by
# default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-human-access-cluster-admin
subjects:
  - kind: Group
    name: "Kubernetes Admins"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

---
# --- headlamp: web dashboard OIDC login -------------------------------------
# claimMappings for this issuer also apply an empty prefix to username (sub)
# and groups (see the `headlamp` jwt[] entry in development/talos/patches/
# cp-*.yaml), same shape as k8s-human-access above - Headlamp forwards its
# OIDC id_token straight to the API server as a Bearer token (confirmed
# against Headlamp's own docs, see dev/values/headlamp-values.yaml's
# comment), so this identity space is real, unlike the removed "che" one.
# "Headlamp Admins" is the authentik group created in
# dev/values/authentik-values.yaml (id: group-headlamp-admins) - akadmin is
# its only member today, in this single-admin homelab.
#
# Bound to cluster-admin for the same reason k8s-human-access is: this
# represents the repo owner's own access, already equivalent to
# cluster-admin via the X.509 admin kubeconfig - a second front door onto
# the same access level, not an expansion of the trust boundary. Revisit if
# "Headlamp Admins" ever gains a member who isn't the repo owner.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-oidc-cluster-admin
subjects:
  - kind: Group
    name: "Headlamp Admins"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
