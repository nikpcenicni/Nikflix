# SOPS-encrypted. Decrypted in-cluster by sops-secrets-operator into a
# Secret named homepage-widget-tokens, consumed by
# ../../values/homepage-values.yaml via envFrom, so Homepage's
# services.yaml ConfigMap can reference each value through the
# {{HOMEPAGE_VAR_*}} substitution syntax
# (https://gethomepage.dev/configs/service-widgets/) instead of embedding
# real keys in that plaintext ConfigMap - see ../../apps/homepage.yaml.
#
# Every value here is a read-capable API key/token for an app this
# dashboard shows live status for, fetched directly from each app's own
# running config (Sonarr/Radarr/Prowlarr's config.xml <ApiKey>, Bazarr's
# config/config.yaml auth.apikey, SABnzbd's sabnzbd.ini api_key, Seerr's
# settings.json main.apiKey), or minted fresh for this purpose:
#   - GRAFANA_API_KEY: a new Grafana service account ("homepage", Viewer
#     role) + token, created via Grafana's own HTTP API using the existing
#     grafana-admin-credentials Secret (see ../../values/kube-prometheus-stack-values.yaml).
#   - AUTHENTIK_API_KEY: a new authentik internal service-account user
#     ("homepage", not staff/superuser) + API token, created via `ak
#     shell` the same way README.md's "Bootstrapping the outpost token"
#     section creates the media outpost's token. If the authentik widget's
#     tile shows limited data because of this account's permissions,
#     grant it more access by hand in the authentik UI (Directory ->
#     Users -> homepage) rather than re-running this step.
#
# custom.js's random-nature-photo background does NOT have a key here:
# Homepage's {{HOMEPAGE_VAR_*}} substitution was confirmed live to only
# reach services.yaml, not custom.js/custom.css, so a real Unsplash
# Access Key would have had to sit in homepage-values.yaml as a plain
# literal - unacceptable in this repo's public git history. A key was
# used once, locally (this machine's gitignored .env, never committed)
# to download a handful of JPEGs, now baked in as static assets - see
# homepage-values.yaml's header comment and ../homepage-assets/.
# No token exists for ArgoCD (no local admin password is known - login is
# OIDC-only via authentik, see README.md's "SSO / authentik") or for
# qBittorrent (its WebUI password was already changed from the chart
# default at some point and isn't recoverable from the PBKDF2 hash stored
# in its config) - both fall back to a ping-only tile in
# ../../values/homepage-values.yaml's services.yaml until a human supplies
# real credentials. See that file's comments for exactly what to add.
#
# Edit with `sops argocd/dev/manifests/secrets/homepage-widget-tokens.yaml`.
apiVersion: isindir.github.com/v1alpha3
