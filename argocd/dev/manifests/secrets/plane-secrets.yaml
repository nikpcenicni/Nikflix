        # Referenced by external_secrets.pgdb_existingSecret.
        # The postgres StatefulSet reads POSTGRES_PASSWORD/USER/DB from here.
        # POSTGRES_PASSWORD MUST match env.pgdb_password in plane-values.yaml
        # (the chart builds DATABASE_URL from the values file, not this Secret).
        - name: plane-pgdb
          stringData:
            POSTGRES_USER: ENC[AES256_GCM,data:g/cal6Y=,iv:PIeN0Lefc3jK1mLou38RihtALUuuyZTOCcdDOZm1CzQ=,tag:Mg7L/SFtXiHNLj+19jjuEA==,type:str]
