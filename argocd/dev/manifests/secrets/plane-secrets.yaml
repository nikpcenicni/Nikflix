# SOPS-encrypted. Decrypted in-cluster by sops-secrets-operator into four
# plain Secrets (one secretTemplate per named Secret below) in the `plane`
# namespace. Referenced by ../../../values/plane-values.yaml's
# external_secrets.* fields.
#
# HOW TO FILL AND ENCRYPT (run once before the first sync):
#
#   1. Generate a SECRET_KEY (50+ random characters):
#        python3 -c "import secrets; print(secrets.token_hex(32))"
#      Or: openssl rand -hex 32
#
#   2. Generate a LIVE_SERVER_SECRET_KEY (same approach, different value):
#        python3 -c "import secrets; print(secrets.token_hex(32))"
#
#   3. POSTGRES_PASSWORD: defaults to "plane" (the chart's own default),
#      which is fine for this internal-only service (no cluster Ingress).
#      To use a real password, change it here AND change env.pgdb_password
#      in plane-values.yaml to match - both must agree, because the chart
#      builds DATABASE_URL from the values file's env.pgdb_password while
#      the postgres container reads POSTGRES_PASSWORD from this Secret.
#
#   4. RABBITMQ_DEFAULT_PASS: same reasoning as postgres - defaults to "plane".
#      Internal-only service, no external access. Change here if desired.
#
#   5. MINIO_ROOT_USER / MINIO_ROOT_PASSWORD: MinIO root credentials, also
#      used as AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY by the app workloads.
#      "admin" / "password" are MinIO's well-known defaults. The MinIO
#      console has no cluster Ingress - internal-only. Change if desired.
#
#   6. Edit this file with your $EDITOR, fill in the FILL_IN_* placeholders
#      above (the other fields with literal default values can stay as-is
#      or be changed).
#
#   7. Encrypt and commit:
#        export SOPS_AGE_KEY_FILE=/path/to/age-key.txt
#        sops --encrypt --in-place argocd/dev/manifests/secrets/plane-secrets.yaml
#
#   After encryption the stringData values become ENC[...] ciphertext.
#   To edit later: sops argocd/dev/manifests/secrets/plane-secrets.yaml
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: plane-secrets
    namespace: plane
spec:
    secretTemplates:
        # Referenced by external_secrets.app_keys_existingSecret in
        # plane-values.yaml. Added last in envFrom on every workload, so
        # these two keys override the chart-generated app-secrets values.
        # These are security-critical: SECRET_KEY encrypts instance config
        # rows in the database. Never rotate SECRET_KEY on a running instance
        # without migrating the encrypted values first.
        - name: plane-app-keys
          stringData:
            SECRET_KEY: ENC[AES256_GCM,data:y58/HuvQIMXZMuygVHhfXENOg8cBhkONmDNZEMe3/VxHNPu/NVZqWNWdi87WXkm8pS1DxmrlfpmJRSAhA5dDkQ==,iv:D7NAlyzJ8gstGOfB/MK2go86TKW7LH3IcyqFpGD3i5w=,tag:zdzeR7ewa7iYCOUQ5NtjjA==,type:str]
