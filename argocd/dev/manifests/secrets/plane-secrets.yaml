        # MinIO uses MINIO_ROOT_USER/PASSWORD; the backend uses
        # AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY (same credential pair, two names).
        # FILE_SIZE_LIMIT and AWS_S3_BUCKET_NAME are non-sensitive config
