# SOPS-encrypted. Decrypted in-cluster by sops-secrets-operator into a
# Secret named headlamp-oidc-secret, referenced by
# ../../values/headlamp-values.yaml's config.oidc.externalSecret. Headlamp's
# chart dumps every key of this Secret into the container's env via envFrom
# (not a per-key secretKeyRef list like Grafana/ArgoCD's oidc secrets), so
# it carries OIDC_ISSUER_URL and OIDC_CALLBACK_URL/OIDC_SCOPES here too even
# though those three aren't secret-shaped - simplest way to guarantee the
# env vars headlamp's `-oidc-*` args reference actually exist.
#
# OIDC_CLIENT_ID/OIDC_CLIENT_SECRET must match authentik-oauth-clients.yaml's
# HEADLAMP_OAUTH_CLIENT_ID/SECRET - same OAuth2 client, consumed by two
# different apps (Headlamp here, authentik's blueprint there). OIDC_ISSUER_URL
# is authentik's Headlamp OAuth2Provider/Application slug
# (dev/values/authentik-values.yaml's provider-headlamp), and must also
# match the `headlamp` jwt[] issuer.url entry added to
# development/talos/patches/cp-*.yaml's AuthenticationConfiguration -
# Headlamp forwards its OIDC id_token straight to the Kubernetes API server
# as a Bearer token (confirmed against Headlamp's own docs before wiring
# this - unlike Eclipse Che's dashboard, which does NOT do this on
# non-OpenShift, see oidc-rbac.yaml's comment for that dead end). Scopes
# request openid+email+profile because authentik's default `profile` scope
# mapping is what returns the `groups` claim the API server's claimMappings
# reads (same mechanism Grafana's OIDC already relies on).
# Edit with `sops argocd/dev/manifests/secrets/headlamp-oidc.yaml`.
