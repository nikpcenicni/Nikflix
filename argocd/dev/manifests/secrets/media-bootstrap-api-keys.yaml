# SOPS-encrypted. Decrypted in-cluster by sops-secrets-operator into a
# Secret named media-bootstrap-api-keys, referenced by the media-bootstrap
# Job (../media-bootstrap/) to wire Prowlarr/Sonarr/Radarr/Bazarr/
# qBittorrent/SABnzbd together via their REST APIs - see argocd/README.md's
# "Media stack" section.
#
# SONARR_API_KEY/RADARR_API_KEY/PROWLARR_API_KEY/BAZARR_API_KEY/
# SABNZBD_API_KEY are each app's own auto-generated API key
# (LinuxServer.io *arr images and Bazarr generate one on first boot into
# their config file) - not set by this repo, just read from the
# already-running pods and stored here so the bootstrap Job can use them.
# QBITTORRENT_PASSWORD is different: qBittorrent has no API key, only a
# WebUI username/password - the LinuxServer.io image generates a random
# *temporary* one on first boot and logs it in plaintext, so this value
# was reset to a real password via qBittorrent's own API
# (POST /api/v2/app/setPreferences) rather than kept as the logged
# temporary one. Username is "admin" for all of these.
#
# If any app's PVC is ever wiped and it generates a new key/password,
# re-run the same retrieval (or password-reset, for qBittorrent) and
# update this file - see the comment in media-bootstrap.yaml.
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: media-bootstrap-api-keys
    namespace: media
    labels:
        app.kubernetes.io/part-of: media-bootstrap
spec:
    secretTemplates:
        - name: media-bootstrap-api-keys
          labels:
            app.kubernetes.io/part-of: media-bootstrap
          stringData:
