# SOPS-encrypted. Decrypted in-cluster by sops-secrets-operator into a
# Secret named vikunja-oidc-secret in the `vikunja` namespace.
#
# Contains the complete Vikunja config.yml including OIDC client credentials.
# Mounted at /etc/vikunja/config.yml by the Vikunja pod (via persistence.config
# in vikunja-values.yaml). Viper cannot map env vars to YAML list items, so
# the credentials must live in the config file itself.
#
# The clientid/clientsecret MUST match VIKUNJA_OAUTH_CLIENT_ID and
# VIKUNJA_OAUTH_CLIENT_SECRET in authentik-oauth-clients.yaml (different
# namespace - Authentik reads those, Vikunja reads these).
#
# To edit after encryption:
#   sops argocd/dev/manifests/secrets/vikunja-oidc-secret.yaml
