# Harbor admin password and Authentik OIDC client credentials.
# SOPS-encrypted. Decrypted in-cluster by sops-secrets-operator into a
# Secret named harbor-secrets, referenced by
# ../../values/harbor-values.yaml's existingSecretAdminPassword and
# core.extraEnvVars entries.
#
# SETUP STEPS (one-time, before syncing the harbor Application):
#
#   1. Generate a strong admin password and an OIDC client ID/secret pair:
#        HARBOR_ADMIN_PASSWORD: openssl rand -base64 32
#        HARBOR_OIDC_CLIENT_ID:  generate in the Authentik admin UI
#        HARBOR_OIDC_CLIENT_SECRET: generate alongside the client ID
#
#   2. Encrypt this file (fills in real ciphertext):
#        sops -e -i argocd/dev/manifests/secrets/harbor-secrets.yaml
#
#   3. Add HARBOR_OAUTH_CLIENT_ID and HARBOR_OAUTH_CLIENT_SECRET (same
#      values as HARBOR_OIDC_CLIENT_ID / HARBOR_OIDC_CLIENT_SECRET) to
#      authentik-oauth-clients.yaml:
#        sops argocd/dev/manifests/secrets/authentik-oauth-clients.yaml
#
# Edit with `sops argocd/dev/manifests/secrets/harbor-secrets.yaml`.
# Never edit the ciphertext by hand. See argocd/README.md's
# "Secrets management" section.
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: harbor-secrets
    namespace: harbor
spec:
    secretTemplates:
        - name: harbor-secrets
          stringData:
            HARBOR_ADMIN_PASSWORD: "CHANGEME-replace-before-encrypt"
            HARBOR_OIDC_CLIENT_ID: "CHANGEME-replace-before-encrypt"
            HARBOR_OIDC_CLIENT_SECRET: "CHANGEME-replace-before-encrypt"
sops:
    kms: []
    gcp_kms: []
    azure_kv: []
    hc_vault: []
    age: []
    lastmodified: ""
    mac: ""
    version: ""
