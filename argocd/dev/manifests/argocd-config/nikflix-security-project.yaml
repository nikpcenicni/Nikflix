# AppProject for security infrastructure (Harbor and Kyverno).
# Restricts allowed source repos, destination namespaces, and the
# cluster-scoped resource types these two Applications may manage.
# Deployed by the argocd-config Application (../apps/argocd-config.yaml)
# which already has permission to create AppProject resources in the
# argocd namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nikflix-security
  namespace: argocd
spec:
  description: Container registry (Harbor) and policy engine (Kyverno)
  sourceRepos:
    - https://github.com/nikpcenicni/Nikflix.git
    - https://helm.goharbor.io
    - https://kyverno.github.io/kyverno/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: kyverno
  clusterResourceWhitelist:
    # Kyverno installs and owns these cluster-scoped resource types
    - group: kyverno.io
      kind: ClusterPolicy
    - group: kyverno.io
      kind: ClusterCleanupPolicy
    - group: kyverno.io
      kind: PolicyException
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
