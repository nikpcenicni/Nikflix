# homepage namespace - dashboard with widgets calling cluster service APIs.
# Widget integrations query Sonarr, Radarr, qBittorrent, Prometheus, etc.
# via their cluster-internal APIs, so egress to all namespaces is required.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
---
# Widget API calls to Sonarr, Radarr, Prometheus, qBittorrent, etc.
# across multiple namespaces, plus external services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-widget-egress
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
    - ports:
        - port: 443
          protocol: TCP
