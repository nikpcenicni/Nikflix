---
# Bambuddy communicates with Bambu Lab printers on the LAN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: bambuddy
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.0.0/16
    - ports:
        - port: 443
          protocol: TCP
