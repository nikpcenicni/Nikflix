# SOPS-encrypted secrets, decrypted in-cluster by sops-secrets-operator -
# ../manifests/secrets/. Every file there is a SopsSecret custom resource;
# only its data/stringData values are encrypted (see ../../../.sops.yaml).
# Depends on sops-secrets-operator.yaml having synced first (needs its CRD
# and the by-hand-bootstrapped sops-age-key Secret) - see
# argocd/README.md's "Secrets management" section.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nikpcenicni/Nikflix.git
    targetRevision: main
    path: argocd/dev/manifests/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
