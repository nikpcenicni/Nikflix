# Radarr - movie automation, same as Sonarr for TV. Values in
# ../values/radarr-values.yaml. See docs/architecture/media-stack.md#components.
# First-time setup (connecting Prowlarr and the downloaders, adding the
# /movies root folder) is manual, through Radarr's own web UI - see
# ../../README.md's "Media stack" section.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radarr
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.0.1
      helm:
        valueFiles:
          - $values/argocd/dev/values/radarr-values.yaml
    - repoURL: https://github.com/nikpcenicni/Nikflix.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
