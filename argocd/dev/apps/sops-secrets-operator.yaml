# SOPS secrets operator, values in ../values/sops-secrets-operator-values.yaml.
# Watches SopsSecret custom resources cluster-wide (see
# ../manifests/secrets/) and decrypts them into real Kubernetes Secrets,
# using the age private key bootstrapped by hand into the sops-age-key
# Secret - see argocd/README.md's "Secrets management" section.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://isindir.github.io/sops-secrets-operator/
      chart: sops-secrets-operator
      targetRevision: 0.28.0
      helm:
        valueFiles:
          - $values/argocd/dev/values/sops-secrets-operator-values.yaml
    - repoURL: https://github.com/nikpcenicni/Nikflix.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
