# One-shot bootstrap Job wiring Prowlarr/Sonarr/Radarr/Bazarr together via
# their REST APIs - ../manifests/media-bootstrap/. Deliberately NOT
# automated sync: Jobs are immutable after creation, so automated
# selfHeal/prune on every reconcile would fight with a Job that's already
# run. Sync this by hand (ArgoCD UI "Sync" button, or
# `argocd app sync media-bootstrap`) whenever you need to (re-)run it -
# see argocd/README.md's "Media stack" section. Depends on the secrets
# Application (media-bootstrap-api-keys) having synced first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nikpcenicni/Nikflix.git
    targetRevision: main
    path: argocd/dev/manifests/media-bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - Replace=true
