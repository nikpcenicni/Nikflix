# Per-node Loki log shipper (daemonset), values in ../values/alloy-values.yaml.
# Same "monitoring" namespace as loki.yaml, which it ships logs to. See
# docs/architecture/talos.md's "Core platform applications" (log shipper).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.11.0
      helm:
        valueFiles:
          - $values/argocd/dev/values/alloy-values.yaml
    - repoURL: https://github.com/nikpcenicni/Nikflix.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
