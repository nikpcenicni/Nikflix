# cert-manager - issues and renews TLS certificates. Previously installed
# by hand (see ../../README.md's former "Applications not yet onboarded"
# note); brought under GitOps at the same chart version already live
# (cert-manager-v1.21.0), so this sync is a no-op against the running
# cluster. The cluster-issuers Application (ClusterIssuer resources) depends
# on this one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.0
      helm:
        valueFiles:
          - $values/argocd/dev/values/cert-manager-values.yaml
    - repoURL: https://github.com/nikpcenicni/Nikflix.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # cert-manager's CRDs are large enough to risk exceeding
      # kubectl.kubernetes.io/last-applied-configuration's 262144-byte
      # annotation limit under client-side apply - same reasoning as
      # kube-prometheus-stack.yaml.
      - ServerSideApply=true
