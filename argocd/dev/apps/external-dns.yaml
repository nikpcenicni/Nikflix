# external-dns, values in ../values/external-dns-values.yaml. Watches
# Ingress resources cluster-wide and auto-creates/updates matching local DNS
# records in pi-hole - see ../../README.md's "DNS / external-dns" section.
# Depends on sops-secrets-operator and secrets having synced first, for the
# pihole-credentials Secret to exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.21.1
      helm:
        valueFiles:
          - $values/argocd/dev/values/external-dns-values.yaml
    - repoURL: https://github.com/nikpcenicni/Nikflix.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
