# Prometheus + Grafana + Alertmanager, values in ../values/kube-prometheus-stack-values.yaml.
# See docs/architecture/talos.md's "Core platform applications" (Prometheus, Grafana).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.21.0
      helm:
        valueFiles:
          - $values/argocd/dev/values/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/nikpcenicni/Nikflix.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The prometheus-operator CRDs this chart installs (prometheuses,
      # alertmanagers, etc.) have OpenAPI schemas large enough that
      # client-side apply's kubectl.kubernetes.io/last-applied-configuration
      # annotation exceeds Kubernetes' 262144-byte annotation limit. Server-side
      # apply doesn't use that annotation, so it doesn't hit the limit.
      - ServerSideApply=true
