# Raw Ingress manifests for already-installed apps (ArgoCD, Headlamp,
# Grafana, authentik) - ../manifests/ingress-apps/. Each resource sets its
# own namespace, so destination.namespace below is only a fallback.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nikpcenicni/Nikflix.git
    targetRevision: main
    path: argocd/dev/manifests/ingress-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
