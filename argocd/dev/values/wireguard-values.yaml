# WireGuard VPN - values for the bjw-s/app-template Helm chart.
# See ../apps/wireguard.yaml.
#
# Uses wg-easy (ghcr.io/wg-easy/wg-easy) - a WireGuard server with a web
# UI for creating and exporting peer configs (QR codes, .conf files). The
# web UI lives at wg.lab.pcenicni.dev behind Authentik forward-auth; the
# WireGuard tunnel is exposed via MetalLB LoadBalancer on UDP 51820.
#
# hostNetwork: the pod runs in the node's network namespace (not a pod
# namespace). This is required because:
#   1. The iptables nat table in a pod's own namespace doesn't work on Talos
#      (iptable_nat module never loaded; Talos uses a compiled-in iptables
#      path that is only accessible from the host namespace).
#   2. The pod needs to reach 192.168.10.0/24 (MetalLB/LAN) to forward
#      VPN peer traffic to Traefik - only reachable from the host namespace
#      via ens18 (the node's LAN interface at 192.168.10.x).
#   3. kube-proxy already manages iptables in the host namespace, so the
#      MASQUERADE rules added by WG_POST_UP actually take effect.
#
# Peer config: WG_ALLOWED_IPS pushes a full-tunnel config to each peer
# (0.0.0.0/0) with 1.1.1.1 as DNS. All peer traffic exits via the node's
# ens18 interface → router → internet / back to cluster services.
#
# Router setup required: UDP 51820 must be port-forwarded from the router's
# WAN interface to 192.168.10.244 (MetalLB LoadBalancer IP). WG_HOST must
# match the public hostname / DDNS name pointing at the router's public IP.

defaultPodOptions:
  # Share the node's network namespace. See header comment.
  hostNetwork: true
  # Must be ClusterFirstWithHostNet so the pod still resolves cluster DNS
  # (e.g. authentik-outpost service IPs) despite hostNetwork.
  dnsPolicy: ClusterFirstWithHostNet

controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/wg-easy/wg-easy
          tag: "14"
          pullPolicy: IfNotPresent
        env:
          # External hostname baked into every peer config as the Endpoint.
          # Cloudflare DNS: vpn.pcenicni.dev A record → public IP, DNS-only
          # (grey cloud). UniFi: port-forward UDP 51820 WAN → 192.168.10.244.
          WG_HOST: "vpn.pcenicni.dev"
          WG_PORT: "51820"
          # Full-tunnel: all peer traffic exits via the node's ens18 interface.
          WG_DEFAULT_DNS: "1.1.1.1, 1.0.0.1"
          WG_ALLOWED_IPS: "0.0.0.0/0, ::/0"
          LANG: "en"
          # ens18 is the Talos node's LAN interface (192.168.10.x/24).
          # kube-proxy also uses iptables-nft (not legacy) in the host namespace
          # - the legacy iptable_nat module is never loaded on Talos. Use
          # iptables-nft so the rules land in the nf_tables subsystem.
          WG_PRE_UP: ""
          WG_POST_UP: "iptables-nft -t nat -A POSTROUTING -s 10.8.0.0/24 -o ens18 -j MASQUERADE; iptables-nft -A FORWARD -i wg0 -j ACCEPT; iptables-nft -A FORWARD -o wg0 -j ACCEPT;"
          WG_PRE_DOWN: ""
          WG_POST_DOWN: "iptables-nft -t nat -D POSTROUTING -s 10.8.0.0/24 -o ens18 -j MASQUERADE; iptables-nft -D FORWARD -i wg0 -j ACCEPT; iptables-nft -D FORWARD -o wg0 -j ACCEPT;"
        # No PASSWORD_HASH set - wg-easy runs without a password prompt.
        # Authentik forward-auth on the Ingress is the only gate.
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 51821
              initialDelaySeconds: 10
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 51821
              initialDelaySeconds: 5
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 51821
  vpn:
    controller: main
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 192.168.10.244
    ports:
      wg:
        port: 51820
        protocol: UDP

ingress:
  main:
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.middlewares: media-authentik-forward-auth@kubernetescrd
    hosts:
      - host: wg.lab.pcenicni.dev
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts: ["wg.lab.pcenicni.dev"]
        secretName: wireguard-tls

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: local-path
    advancedMounts:
      main:
        main:
          # WireGuard keys, server config, and peer configs all live here.
          # Must persist across pod restarts - existing peer private keys
          # are stored here and cannot be regenerated without breaking
          # connected clients.
          - path: /etc/wireguard
