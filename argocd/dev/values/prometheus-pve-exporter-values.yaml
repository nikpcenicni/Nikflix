# prometheus-pve-exporter - values for the bjw-s/app-template Helm chart.
# See ../apps/prometheus-pve-exporter.yaml. Scrapes the "noble" Proxmox VE
# cluster (3 nodes, API at 192.168.10.10:8006, reachable from this cluster's
# pods) using a read-only monitoring@pve/PVEAuditor API token.
#
# The pve-exporter-config SopsSecret
# (../manifests/secrets/pve-exporter.yaml) holds a single stringData key,
# pve.yml, in the exact format this image reads (a `default:` block with
# user/token_name/token_value/verify_ssl) - mounted below as a `type: secret`
# persistence item with subPath, scoped to just that one file. The image's
# default config path is /etc/prometheus/pve.yml (confirmed live via the
# FileNotFoundError this crashed with before this path was corrected - not
# the more obvious-looking /etc/pve.yml some usage examples show for older
# versions). No command/args override needed; serves on :9221 at /pve.
controllers:
  main:
    containers:
      main:
        image:
          repository: prompve/prometheus-pve-exporter
          tag: "3.10.0"
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi

service:
  main:
    controller: main
    ports:
      metrics:
        port: 9221

persistence:
  config:
    enabled: true
    type: secret
    name: pve-exporter-config
    globalMounts:
      # A whole-directory mount at /etc blocks kubelet from bind-mounting its
      # own /etc/hosts, /etc/hostname, /etc/resolv.conf into the container
      # (the Secret volume is read-only, so runc can't create those
      # mountpoints inside it) - confirmed live: "make mountpoint /etc/hosts:
      # read-only file system". subPath scopes the mount to just the
      # pve.yml key, at the path this image actually reads by default.
      - path: /etc/prometheus/pve.yml
        subPath: pve.yml
        readOnly: true

# prometheus-pve-exporter is a blackbox-style multi-target exporter, not a
# plain /metrics endpoint: Prometheus has to hit /pve?target=<proxmox-host>
# on the exporter's own Service, then relabel the scraped series so
# `instance` reads as the actual Proxmox host (192.168.10.10), not the
# exporter pod's own address.
#
# This is NOT the textbook blackbox_exporter relabeling recipe (that recipe
# copies __address__ into __param_target first) - that step is wrong here
# and was a bug in an earlier version of this file, confirmed live: it
# clobbered the target query param with the exporter pod's own address
# (scrape URL ended up as .../pve?target=10.244.x.x%3A9221 instead of
# .../pve?target=192.168.10.10), and the exporter 500'd trying to probe
# itself. Root cause: blackbox_exporter's static_configs targets list *is*
# the set of URLs to probe, so __address__ starts out as the real target -
# but a ServiceMonitor's __address__ always starts as the exporter's own
# Service/Pod endpoint, discovered via Kubernetes SD. Prometheus already
# auto-derives __param_target from the `params` block below before
# relabeling runs, so it's correct as-is - copying __address__ over it only
# destroys that. Two relabelings, not three: capture the already-correct
# __param_target into `instance`, then point __address__ at the exporter's
# real Service so the HTTP request actually goes there.
#
# `release: kube-prometheus-stack` is required - this cluster's Prometheus
# only watches ServiceMonitors carrying that exact label (same convention as
# ../manifests/argocd-config/servicemonitors.yaml).
serviceMonitor:
  main:
    service:
      identifier: main
    labels:
      release: kube-prometheus-stack
    endpoints:
      - port: metrics
        path: /pve
        interval: 30s
        params:
          target: ["192.168.10.10"]
        relabelings:
          - sourceLabels: ["__param_target"]
            targetLabel: instance
          - targetLabel: __address__
            replacement: prometheus-pve-exporter:9221
