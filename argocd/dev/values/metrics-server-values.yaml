# metrics-server - values for the official metrics-server Helm chart. See
# ../apps/metrics-server.yaml. Provides the Kubernetes Metrics API
# (`kubectl top nodes`/`kubectl top pods`, and CPU/memory usage data for
# Ballast's kubernetesMetrics MetricsSource - see ../apps/ballast.yaml).
#
# --kubelet-insecure-tls confirmed necessary live: without it every node
# scrape failed with "x509: cannot validate certificate for <node IP>
# because it doesn't contain any IP SANs" - Talos's kubelet serving certs
# are valid but only SAN the node's hostname, not its IP, and this chart's
# default --kubelet-preferred-address-types prefers InternalIP first. The
# Metrics API itself is still served over TLS to callers (kube-apiserver,
# Ballast, `kubectl top`) via this chart's own generated serving
# certificate - this flag only disables metrics-server's *outbound*
# verification of each kubelet's cert, not inbound auth to metrics-server.
args:
  - --kubelet-insecure-tls

# Resources trimmed down from the chart's own defaults (100m/200Mi request, no
# limit), matching this repo's dev-cluster convention of scaling requests/
# limits down for these VMs - see the comment at the top of
# kube-prometheus-stack-values.yaml.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi
