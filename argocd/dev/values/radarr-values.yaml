# Radarr - values for the bjw-s/app-template Helm chart. See
# ../apps/radarr.yaml. See docs/architecture/media-stack.md#components and
# #storage-shared-nas-library.
#
# NAS is 192.168.50.105 (OpenMediaVault, VLAN 50 - an interim stand-in for
# the target-state VLAN 80 NAS, see ../../README.md's "Media stack"
# section). Export paths assume OMV exports the shared folder's real
# filesystem path directly (/srv/mergerfs/Pool/Data/<name>) - confirm
# against `cat /etc/exports` on the NAS if these ever look wrong.
#
# PUID/PGID match the NAS's `media` system account (uid=1004, gid=100 -
# the shared `users` group other data on this NAS already uses). UMASK=002
# keeps newly-created files/dirs group-writable, matching the setgid bit
# already set on these NFS exports.
controllers:
  main:
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/radarr
          tag: latest
        env:
          PUID: "1004"
          PGID: "100"
          UMASK: "002"
          # Adjust to your local timezone.
          TZ: "Etc/UTC"
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 7878

ingress:
  main:
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: radarr.lab.pcenicni.dev
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts: ["radarr.lab.pcenicni.dev"]
        secretName: radarr-tls

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: local-path
    globalMounts:
      - path: /config
  # qBittorrent's completed downloads land here.
  torrents:
    enabled: true
    type: nfs
    server: "192.168.50.105"
    path: /srv/mergerfs/Pool/Data/torrents
    globalMounts:
      - path: /torrents
  # SABnzbd's completed downloads land here.
  usenet:
    enabled: true
    type: nfs
    server: "192.168.50.105"
    path: /srv/mergerfs/Pool/Data/usenet
    globalMounts:
      - path: /usenet
  # The shared library - Radarr's root folder gets set to /media/movies
  # through its own web UI after first sync.
  media:
    enabled: true
    type: nfs
    server: "192.168.50.105"
    path: /srv/mergerfs/Pool/Data/media
    globalMounts:
      - path: /media
