# sops-secrets-operator - values for the sops-secrets-operator Helm chart.
# See ../apps/sops-secrets-operator.yaml.
#
# Cluster-wide: SopsSecret resources for authentik, Grafana, and ArgoCD live
# in the authentik/monitoring/argocd namespaces, not just this one.
namespaced: false

# Age private key, bootstrapped by hand as the sops-age-key Secret in this
# namespace (kubectl create secret generic sops-age-key -n sops
# --from-file=keys.txt=<age private key file>) - not managed by GitOps, same
# as the cloudflare-api-token secret the cluster-issuers Application depends
# on. See argocd/README.md's "Secrets management" section.
secretsAsFiles:
  - name: sops-age-key
    mountPath: /etc/sops-age-key
    secretName: sops-age-key
extraEnv:
  - name: SOPS_AGE_KEY_FILE
    value: /etc/sops-age-key/keys.txt

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
