# Authentik identity provider - values for the authentik Helm chart.
# See ../apps/authentik.yaml and docs/architecture/talos.md's "Core platform
# applications" section.
#
# No plaintext secrets here - every secret-shaped value is read from a
# Kubernetes Secret that sops-secrets-operator decrypts from
# ../manifests/secrets/ at sync time. See argocd/README.md's "Secrets
# management" section.
authentik:
  # Replaces the chart's own generated Secret entirely - see
  # ../manifests/secrets/authentik-config.yaml for AUTHENTIK_SECRET_KEY and
  # the AUTHENTIK_POSTGRESQL__* keys this must contain.
  existingSecret:
    secretName: authentik-config

# authentik has no admin UI yet on first boot - AUTHENTIK_BOOTSTRAP_PASSWORD
# (from the same authentik-config Secret) creates the akadmin superuser on
# first startup only, against an empty database.
global:
  env:
    - name: AUTHENTIK_BOOTSTRAP_EMAIL
      value: akadmin@lab.pcenicni.dev
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-config
          key: AUTHENTIK_BOOTSTRAP_PASSWORD
    # Read by the authentik-blueprints ConfigMap below via the blueprint
    # !Env tag - https://docs.goauthentik.io/customize/blueprints/v1/tags.
    - name: GRAFANA_OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: authentik-oauth-clients
          key: GRAFANA_OAUTH_CLIENT_ID
    - name: GRAFANA_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oauth-clients
          key: GRAFANA_OAUTH_CLIENT_SECRET
    - name: ARGOCD_OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: authentik-oauth-clients
          key: ARGOCD_OAUTH_CLIENT_ID
    - name: ARGOCD_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oauth-clients
          key: ARGOCD_OAUTH_CLIENT_SECRET
    - name: HEADLAMP_OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: authentik-oauth-clients
          key: HEADLAMP_OAUTH_CLIENT_ID
    - name: HEADLAMP_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oauth-clients
          key: HEADLAMP_OAUTH_CLIENT_SECRET

# The remote-cluster service account (Kubernetes source-of-truth outposts)
# is not used here - authentik only issues OIDC tokens for the apps below.
serviceAccount:
  create: false

server:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Ingress for authentik itself lives in ../manifests/ingress-apps/, same as
  # every other app's Ingress in this cluster - not the chart's own Ingress.
  ingress:
    enabled: false

worker:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    # Matches AUTHENTIK_POSTGRESQL__PASSWORD in
    # ../manifests/secrets/authentik-config.yaml - see
    # ../manifests/secrets/authentik-postgresql.yaml for the "password" and
    # "postgres-password" keys this secret must contain.
    existingSecret: authentik-postgresql-secret
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

# Custom blueprint: creates the OAuth2 providers, applications, and RBAC
# groups for the other system apps in this cluster. The worker discovers any
# *.yaml key in a ConfigMap named here and applies it declaratively -
# https://docs.goauthentik.io/customize/blueprints/.
blueprints:
  configMaps:
    - authentik-blueprints

# The blueprint ConfigMap itself, deployed as part of this same Helm release
# via the chart's generic "additionalObjects" passthrough. client_id/secret
# values use the blueprint `!Env` tag to read the env vars set above
# (sourced from the authentik-oauth-clients Secret) - nothing secret-shaped
# is written into this ConfigMap.
additionalObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: authentik-blueprints
    data:
      system-apps.yaml: |
        version: 1
        metadata:
          name: Nikflix dev cluster - system app SSO
        entries:
          # --- RBAC groups -----------------------------------------------
          # Membership is managed by hand in the authentik UI after this
          # syncs - akadmin is seeded into each *Admins group below so the
          # bootstrap superuser has working admin access to every app from
          # the start.
          - model: authentik_core.group
            id: group-grafana-admins
            identifiers:
              name: "Grafana Admins"
            attrs:
              name: "Grafana Admins"
              users:
                - !Find [authentik_core.user, [username, akadmin]]
          - model: authentik_core.group
            id: group-grafana-editors
            identifiers:
              name: "Grafana Editors"
            attrs:
              name: "Grafana Editors"
          - model: authentik_core.group
            id: group-grafana-viewers
            identifiers:
              name: "Grafana Viewers"
            attrs:
              name: "Grafana Viewers"
          - model: authentik_core.group
            id: group-argocd-admins
            identifiers:
              name: "ArgoCD Admins"
            attrs:
              name: "ArgoCD Admins"
              users:
                - !Find [authentik_core.user, [username, akadmin]]
          - model: authentik_core.group
            id: group-argocd-viewers
            identifiers:
              name: "ArgoCD Viewers"
            attrs:
              name: "ArgoCD Viewers"
          - model: authentik_core.group
            id: group-headlamp-admins
            identifiers:
              name: "Headlamp Admins"
            attrs:
              name: "Headlamp Admins"
              users:
                - !Find [authentik_core.user, [username, akadmin]]

          # --- Grafana OAuth2/OIDC provider + application -----------------
          - model: authentik_providers_oauth2.oauth2provider
            id: provider-grafana
            identifiers:
              name: "Grafana"
            attrs:
              name: "Grafana"
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
              client_type: confidential
              grant_types:
                - authorization_code
                - refresh_token
              client_id: !Env GRAFANA_OAUTH_CLIENT_ID
              client_secret: !Env GRAFANA_OAUTH_CLIENT_SECRET
              include_claims_in_id_token: true
              redirect_uris:
                - url: "https://grafana.lab.pcenicni.dev/login/generic_oauth"
                  matching_mode: strict
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          - model: authentik_core.application
            id: application-grafana
            identifiers:
              slug: grafana
            attrs:
              name: Grafana
              slug: grafana
              provider: !KeyOf provider-grafana
              policy_engine_mode: any
              meta_launch_url: "https://grafana.lab.pcenicni.dev"

          # --- ArgoCD OAuth2/OIDC provider + application -------------------
          - model: authentik_providers_oauth2.oauth2provider
            id: provider-argocd
            identifiers:
              name: "ArgoCD"
            attrs:
              name: "ArgoCD"
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
              client_type: confidential
              grant_types:
                - authorization_code
                - refresh_token
              client_id: !Env ARGOCD_OAUTH_CLIENT_ID
              client_secret: !Env ARGOCD_OAUTH_CLIENT_SECRET
              include_claims_in_id_token: true
              redirect_uris:
                - url: "https://argocd.lab.pcenicni.dev/auth/callback"
                  matching_mode: strict
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          - model: authentik_core.application
            id: application-argocd
            identifiers:
              slug: argocd
            attrs:
              name: ArgoCD
              slug: argocd
              provider: !KeyOf provider-argocd
              policy_engine_mode: any
              meta_launch_url: "https://argocd.lab.pcenicni.dev"

          # --- Headlamp OAuth2/OIDC provider + application -----------------
          # authentik-side config only. Logging in still needs Headlamp's
          # own OIDC client config AND the Kubernetes API server's
          # --oidc-* flags (Talos machine config, applied by hand per
          # development/talos/README.md) - neither is wired up yet. See the
          # NOTE in ../../README.md.
          - model: authentik_providers_oauth2.oauth2provider
            id: provider-headlamp
            identifiers:
              name: "Headlamp"
            attrs:
              name: "Headlamp"
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
              client_type: confidential
              grant_types:
                - authorization_code
                - refresh_token
              client_id: !Env HEADLAMP_OAUTH_CLIENT_ID
              client_secret: !Env HEADLAMP_OAUTH_CLIENT_SECRET
              include_claims_in_id_token: true
              redirect_uris:
                - url: "https://headlamp.lab.pcenicni.dev/oidc-callback"
                  matching_mode: strict
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          - model: authentik_core.application
            id: application-headlamp
            identifiers:
              slug: headlamp
            attrs:
              name: Headlamp
              slug: headlamp
              provider: !KeyOf provider-headlamp
              policy_engine_mode: any
              meta_launch_url: "https://headlamp.lab.pcenicni.dev"

          # --- Media stack forward-auth (domain level) --------------------
          # Single Proxy Provider covers every *.lab.pcenicni.dev host via
          # cookie_domain, rather than one provider per app - login once,
          # reach sonarr/radarr/prowlarr/bazarr/qbittorrent/sabnzbd without
          # re-authenticating. Jellyseerr is deliberately not behind this -
          # see argocd/README.md's "Media stack" section. The outpost this
          # provider is assigned to is deployed by hand (raw manifests in
          # ../manifests/authentik-outpost/, not authentik-managed), since
          # this cluster has no Docker/Kubernetes service-connection set up
          # for authentik to deploy outposts itself.
          - model: authentik_providers_proxy.proxyprovider
            id: provider-media-forward-auth
            identifiers:
              name: "Media stack forward auth"
            attrs:
              name: "Media stack forward auth"
              mode: forward_domain
              cookie_domain: lab.pcenicni.dev
              external_host: "https://sonarr.lab.pcenicni.dev"
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          - model: authentik_core.application
            id: application-media-forward-auth
            identifiers:
              slug: media-stack
            attrs:
              name: "Media stack"
              slug: media-stack
              provider: !KeyOf provider-media-forward-auth
              policy_engine_mode: any
          # NOTE: providers uses !Find (a live DB lookup), not !KeyOf (a
          # blueprint-internal reference) - !KeyOf inside a list item for
          # this field hits a real bug in authentik 2026.5.6's blueprint
          # importer (crashes trying to log an EntryInvalidError while
          # resolving it, instead of reporting the real error cleanly).
          # !Find sidesteps it entirely. Verified directly against a live
          # authentik shell (Importer.from_string(...).validate()) before
          # settling on this - see git history for the debugging trail.
          # `config.authentik_host` is also required by the serializer
          # despite having a model-level default - leaving it out fails
          # with "This field is required."
          - model: authentik_outposts.outpost
            id: outpost-media-forward-auth
            identifiers:
              name: "Media stack outpost"
            attrs:
              name: "Media stack outpost"
              type: proxy
              config:
                authentik_host: "https://auth.lab.pcenicni.dev"
              providers:
                - !Find [authentik_providers_proxy.proxyprovider, [name, "Media stack forward auth"]]
