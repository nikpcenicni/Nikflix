# SABnzbd - values for the bjw-s/app-template Helm chart. See
# ../apps/sabnzbd.yaml. Usenet download client - no VPN needed (provider-based,
# not peer-to-peer). See docs/architecture/media-stack.md#components.
#
# NAS is 192.168.50.105 (OpenMediaVault, VLAN 50 - an interim stand-in for
# the target-state VLAN 80 NAS, see ../../README.md's "Media stack"
# section). Export path assumes OMV exports the shared folder's real
# filesystem path directly (/srv/mergerfs/Pool/Data/usenet) - confirm
# against `cat /etc/exports` on the NAS if this ever looks wrong.
#
# PUID/PGID match the NAS's `media` system account (uid=1004, gid=100 -
# the shared `users` group other data on this NAS already uses). UMASK=002
# keeps newly-created files/dirs group-writable, matching the setgid bit
# already set on this NFS export.
controllers:
  main:
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/sabnzbd
          tag: latest
        env:
          PUID: "1004"
          PGID: "100"
          UMASK: "002"
          # Adjust to your local timezone.
          TZ: "Etc/UTC"
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: sabnzbd.lab.pcenicni.dev
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts: ["sabnzbd.lab.pcenicni.dev"]
        secretName: sabnzbd-tls

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: local-path
    globalMounts:
      - path: /config
  downloads:
    enabled: true
    type: nfs
    server: "192.168.50.105"
    path: /export/usenet
    globalMounts:
      - path: /downloads
