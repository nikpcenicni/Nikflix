# Builds and pushes the custom Eclipse Che workspace image used by
# development/eclipse-che/devworkspace.yaml.
#
# PROPOSED - this is the first GitHub Actions workflow and the first
# container-image build/push mechanism in this repo. There was no existing
# precedent to follow, so this is one reasonable choice among a few and
# needs your confirmation before it's relied on:
#
#   - GHCR (ghcr.io/nikpcenicni/claude-code-workspace) is free for public
#     images and needs no registry credentials beyond the automatic
#     GITHUB_TOKEN (via `packages: write` permission below) - no new secret
#     to create or rotate.
#   - The alternative for a homelab this size is simpler: skip CI entirely
#     and `docker build`/`docker push` by hand from a workstation whenever
#     the Dockerfile changes. That avoids adding GitHub Actions as a new
#     moving part to this repo, at the cost of remembering to rebuild by
#     hand after edits.
#
# If you'd rather build by hand, delete this file and ignore it - nothing
# else in this repo depends on it existing.
name: Build Claude Code workspace image

on:
  push:
    branches: [main]
    paths:
      - development/eclipse-che/images/claude-code-workspace/**
      - .github/workflows/build-claude-code-workspace-image.yml
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/nikpcenicni/claude-code-workspace

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: development/eclipse-che/images/claude-code-workspace
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
