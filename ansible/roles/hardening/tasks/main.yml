---
- name: Apply SSH hardening
  ansible.builtin.import_tasks: ssh_hardening.yml

- name: Apply sysctl hardening
  ansible.builtin.import_tasks: sysctl_hardening.yml
  when: sysctl_hardening_enabled | bool

- name: Configure fail2ban
  ansible.builtin.import_tasks: fail2ban.yml
  when: fail2ban_enabled | bool

- name: Configure auditd
  ansible.builtin.import_tasks: auditd.yml
  when: auditd_enabled | bool
