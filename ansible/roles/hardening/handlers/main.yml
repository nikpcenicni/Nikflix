---
# Handlers run in the order they're defined here (not notification order),
# so "Validate sshd config" always runs before "Restart sshd" - a bad config
# fails the play instead of restarting into a broken/lockout state.

- name: Validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
