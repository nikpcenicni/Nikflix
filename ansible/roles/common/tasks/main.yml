---
- name: Fix up PVE apt repositories
  ansible.builtin.import_tasks: pve_repos.yml
  when: manage_pve_repos | bool

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Full-upgrade all packages
  ansible.builtin.apt:
    upgrade: full
    autoremove: true
    autoclean: true
  register: apt_upgrade_result

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Configure timezone
  ansible.builtin.timezone:
    name: "{{ common_timezone }}"

- name: Enable and start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  when: "'chrony' in common_packages"

- name: Configure unattended-upgrades
  ansible.builtin.import_tasks: unattended_upgrades.yml
  when: enable_unattended_upgrades | bool

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Report reboot required
  ansible.builtin.debug:
    msg: >-
      Reboot required on {{ inventory_hostname }}. Not rebooting automatically
      (reboot_if_required is false) - schedule this manually per node.
  when:
    - reboot_required_file.stat.exists
    - not (reboot_if_required | bool)

- name: Reboot node (reboot_if_required is true)
  ansible.builtin.reboot:
    reboot_timeout: 600
    msg: "Rebooting - triggered by Ansible common role (reboot_if_required)"
  when:
    - reboot_required_file.stat.exists
    - reboot_if_required | bool
