machine:
  install:
    image: ghcr.io/siderolabs/installer:v1.13.7
  # Cluster-wide OIDC for direct human/CLI access to the Kubernetes API,
  # trusting this cluster's own authentik as issuer - see
  # argocd/dev/values/authentik-values.yaml's "Kubernetes human access"
  # OAuth2Provider/Application blueprint entry for the authentik side of
  # this. Talos has no first-class AuthenticationConfiguration field as of
  # this version, so this follows the same file+extraVolume+extraArgs idiom
  # Talos itself documents for other file-based apiserver flags (e.g.
  # --audit-policy-file). This same file content is duplicated on all three
  # control-plane patches (cp-helium/cp-argon/cp-neon) since each node runs
  # its own kube-apiserver static pod - there is no single cluster-wide
  # place to put it instead.
  #
  # Eclipse Che's dashboard also needs a jwt[] entry here - corrected
  # after getting this wrong once already. `pkg/deploy/gateway/gateway.go`'s
  # "native user mode is currently only available on OpenShift" is about a
  # narrower, unrelated check inside the gateway; it says nothing about
  # che-dashboard's own backend. Confirmed directly from che-dashboard's
  # actual source (packages/dashboard-backend/src/routes/api/helpers/
  # getToken.ts + every route handler that calls
  # `kubeConfigProvider.getKubeConfig(getToken(request))`): che-dashboard
  # builds its Kubernetes API client straight from the forwarded
  # Authorization bearer header, on every platform, not just OpenShift -
  # confirmed live with a real 401 Unauthorized ("Unable to list
  # devworkspaces") the first time a login actually reached this code path,
  # right after the `che` entry below had been removed. che-operator
  # provisions per-user RBAC (the che-user-workspace-edit RoleBinding in
  # checluster.yaml) for a `User` matching the token's `name` claim
  # unprefixed (confirmed live - the RoleBinding che-operator already
  # created was for `User "authentik Default Admin"`, i.e. akadmin's
  # Authentik `name` field, not `sub`/`preferred_username`/email, and with
  # no prefix) - claimMappings below matches that convention exactly, not
  # the k8s-human-access entry's `sub`-based mapping, so the two identity
  # spaces stay separated by audience rather than by username shape.
  #
  # auth.lab.pcenicni.dev's TLS cert comes from the letsencrypt-prod cluster
  # issuer (see argocd/README.md's ingress-apps entry) - a publicly-trusted
  # CA already in kube-apiserver's system trust store, so no
  # issuer.certificateAuthority override is needed here. (The separate
  # "authentik Self-signed Certificate" referenced in the blueprint only
  # signs the JWTs themselves, not this TLS endpoint.)
  files:
    - path: /var/lib/kube-apiserver/authentication-config.yaml
      op: create
      permissions: 0o644
      content: |
        apiVersion: apiserver.config.k8s.io/v1beta1
        kind: AuthenticationConfiguration
        jwt:
          # Direct human/CLI OIDC access (kubectl/talosctl-style tooling via
          # a kubelogin/oidc-login credential plugin) - no username/groups
          # prefix, so cluster-admin bindings for these identities (a
          # deliberate follow-up step, not part of this change) can
          # reference the raw authentik username/groups claims directly.
          - issuer:
              url: https://auth.lab.pcenicni.dev/application/o/k8s-human-access/
              audiences:
                - "35aabca831b995702a78135ddbbbd05b"
              audienceMatchPolicy: MatchAny
            claimMappings:
              username:
                claim: "sub"
                prefix: ""
              groups:
                claim: "groups"
                prefix: ""
            userValidationRules:
              - expression: "!user.username.startsWith('system:')"
                message: "k8s-human-access identities must not use the reserved system: prefix"
          # Eclipse Che dashboard - see the comment above for why this
          # exists and why its claimMappings differ from k8s-human-access.
          - issuer:
              url: https://auth.lab.pcenicni.dev/application/o/che/
              audiences:
                - "4939f57d5b52e1250340c91a9304c8e3"
              audienceMatchPolicy: MatchAny
            claimMappings:
              username:
                claim: "name"
                prefix: ""
              groups:
                claim: "groups"
                prefix: ""
            userValidationRules:
              - expression: "!user.username.startsWith('system:')"
                message: "che identities must not use the reserved system: prefix"
cluster:
  apiServer:
    extraArgs:
      authentication-config: /etc/kubernetes/authentication-config.yaml
    extraVolumes:
      - hostPath: /var/lib/kube-apiserver/authentication-config.yaml
        mountPath: /etc/kubernetes/authentication-config.yaml
        readonly: true
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: talos-dev-cp-argon
---
# kube-apiserver's static pod runs hostNetwork: true, so it uses this
# node's own DNS resolver (confirmed: talosctl get resolvers -> the
# node's own gateway, not the cluster's pi-hole split-horizon DNS that
# pod-network components get via the coredns Application). That resolver
# answers auth.lab.pcenicni.dev with a PUBLIC IP, not Traefik's in-cluster
# LoadBalancer IP - confirmed live as the actual root cause of the
# apiserver's OIDC discovery TLS failures ("certificate is valid for
# <hash>.<hash>.traefik.default, not auth.lab.pcenicni.dev" - that's
# Traefik's own fallback cert for an SNI hostname it doesn't recognize,
# meaning the connection was reaching some other Traefik instance
# entirely at the wrong public IP, not this cluster's). This bypasses
# the resolver entirely for this one hostname rather than touching the
# node's broader DNS config.
apiVersion: v1alpha1
kind: StaticHostConfig
name: 192.168.10.240
hostnames:
    - auth.lab.pcenicni.dev
